id: org.swi_prolog.swipl
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: swipl-win

finish-args:
  - --env=NO_AT_BRIDGE=1
  - --env=XCOMPOSEFILE=/app/etc/Compose
  - --env=SDL_CAMERA_DRIVER=pipewire,v4l2
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=host
  - --device=dri

modules:
  - name: libyaml
    sources:
      - type: git
        url: https://github.com/yaml/libyaml
        commit: 840b65c40675e2d06bf40405ad3f12dec7f35923
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'

  - name: utf8proc
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/JuliaStrings/utf8proc.git
        tag: v2.12.0
        commit: 79cdd5ab40c79afa559f689ffc13b76812dee1ac
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  - name: SDL3_sound
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDLSOUND_BUILD_STATIC=OFF
      - -DSDLSOUND_BUILD_TEST=OFF
      - -DSDLSOUND_BUILD_DOCS=OFF
    sources:
      - type: git
        url: https://github.com/icculus/SDL_sound.git
        tag: v3.2.0
        commit: 49b3fad05c70c4f0eeb2a10055dee7a633d86cda
        x-checker-data:
          type: git
          tag-pattern: ^v(3\.[\d.]+)$
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  # Graphviz for library(graphviz), the same minimal build as the
  # Windows and macOS versions (scripts/macos-deps.sh in swipl-devel):
  # only the libraries (cdt, cgraph, pathplan, xdot, gvc) and the dot
  # and neato layout plugins.  No programs, no renderers, no text layout
  # (pango/cairo) and no ltdl: library(graphviz) registers the layout
  # plugins itself, opening them from /app/lib/graphviz.  expat
  # (HTML-like labels) comes from the runtime.  Without GTS, neato loses
  # overlap=prism and sfdp the triangle/rng smoothing modes.
  - name: graphviz
    buildsystem: simple
    build-commands:
      - ./configure --prefix=${FLATPAK_DEST} --libdir=${FLATPAK_DEST}/lib
          --disable-static --enable-shared
          --disable-ltdl --disable-ltdl-install --disable-man-pdfs
          --disable-swig --disable-sharp --disable-d --disable-go
          --disable-guile --disable-java --disable-javascript --disable-lua
          --disable-perl --disable-php --disable-python --disable-python3
          --disable-r --disable-ruby --disable-tcl
          --with-expat --without-x --without-quartz --without-gdiplus
          --without-pangocairo --without-freetype2 --without-libgd
          --without-webp --without-poppler --without-rsvg --without-ghostscript
          --without-lasi --without-gdk --without-gdk-pixbuf --without-gtk
          --without-gtkgl --without-gtkglext --without-glade --without-qt
          --without-glut --without-gts --without-ann --without-devil
          --without-aalib --without-smyrna
          --with-sfdp --with-ortho --with-digcola --with-ipsepcola
      - grep -q '^#define HAVE_EXPAT 1' config.h
      - make -j${FLATPAK_BUILDER_N_JOBS} -C lib
      - make -j${FLATPAK_BUILDER_N_JOBS} -C plugin/dot_layout
      - make -j${FLATPAK_BUILDER_N_JOBS} -C plugin/neato_layout
      - for d in lib/cdt lib/cgraph lib/pathplan lib/xdot lib/common lib/pack
          lib/gvc plugin/dot_layout plugin/neato_layout; do make -C $d install
          || exit 1; done
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.2/graphviz-16.1.2.tar.xz
        sha256: 9780938f03659e2effbbfbbaec94940108e794199b73196fa339ca911890e8c9
        x-checker-data:
          type: json
          url: https://gitlab.com/api/v4/projects/4207231/releases
          version-query: '[.[] | .tag_name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))]
            | first'
          url-query: '"https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/"
            + $version + "/graphviz-" + $version + ".tar.xz"'
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.la'

  - name: fix-compose
    buildsystem: simple
    build-commands:
      - mkdir -p /app/etc
      - grep -v dead_hamza /usr/share/X11/locale/en_US.UTF-8/Compose > /app/etc/Compose

  - name: swipl
    sources:
      - type: git
        url: https://github.com/SWI-Prolog/swipl-devel.git
        tag: V11.1.0
        commit: e67af4ba30f9b4058d56979bd913be4fea30525a
        x-checker-data:
          type: git
          tag-pattern: ^V(\d+\.[\d.]+)$
      - type: file
        path: org.swi_prolog.swipl.desktop
      - type: file
        path: org.swi_prolog.swipl.appdata.xml
      - type: file
        path: org.swi_prolog.swipl.png
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      env:
        SDL_VIDEODRIVER: dummy
    config-opts:
      - -DSKIP_SSL_TESTS=ON
      - -DXPCE_VIDEO=ffmpeg
    post-install:
      - install -D -m0644 ../org.swi_prolog.swipl.png /app/share/icons/hicolor/128x128/apps/org.swi_prolog.swipl.png
      - install -D -m0644 ../org.swi_prolog.swipl.desktop /app/share/applications/org.swi_prolog.swipl.desktop
      - install -D -m0644 ../org.swi_prolog.swipl.appdata.xml /app/share/metainfo/org.swi_prolog.swipl.appdata.xml
